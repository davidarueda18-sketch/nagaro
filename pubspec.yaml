name: nagaro
description: 'Nagaro — Bank expense control app.'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # Networking
  dio: ^5.7.0

  # Local storage
  hive_ce: ^2.9.0
  hive_ce_flutter: ^2.3.4

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Biometric (placeholder)
  local_auth: ^2.3.0

  # Utilities
  intl: ^0.20.2
  logger: ^2.5.0
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  hive_ce_generator: ^1.8.2

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
